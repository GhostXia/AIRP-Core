name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # `.cargo/config.toml` pins target to x86_64-pc-windows-gnu for local Windows
  # builds. On Linux CI we override to native target so no mingw cross-toolchain
  # is required. `CARGO_BUILD_TARGET` takes precedence over `[build] target` in
  # the config file.
  CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo test
        run: cargo test --all --locked

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain with clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-clippy-

      - name: cargo clippy
        run: cargo clippy --lib --bins --all-features -- -D warnings

  fmt:
    # 全仓 fmt sweep（2026-05-23）已完成，此处转为必过门槛。
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain with rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  coverage:
    # M6.6：覆盖率验收（≥ 70%）。
    # 本地 Windows-GNU 工具链不带 profiler_builtins runtime，llvm-cov 无法在开发机跑；
    # 必须借助 Linux CI runner（profiler runtime 默认就位）才能产出覆盖率。
    # 失败信息性 — 不阻塞合并直到稳定满足阈值。
    name: cargo llvm-cov (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain with llvm-tools
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-llvmcov-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-llvmcov-

      - name: Run coverage
        # `--fail-under-lines 70` 强制行覆盖率门槛；低于则该步骤失败
        # （continue-on-error 仍允许 CI 整体绿，便于先收集真实数据）
        run: cargo llvm-cov --workspace --lib --tests --fail-under-lines 70 --summary-only

      - name: Generate LCOV
        run: cargo llvm-cov report --lcov --output-path lcov.info

      - name: Upload LCOV artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: warn
